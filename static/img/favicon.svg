<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a" stroke="url(#grad)" stroke-width="2.5" />
  <!-- Battery Outer Shell -->
  <rect x="18" y="18" width="28" height="36" rx="5" fill="none" stroke="#e2e8f0" stroke-width="2.5" />
  <!-- Battery Terminal Top -->
  <rect x="27" y="13" width="10" height="5" rx="2" fill="#e2e8f0" />
  <!-- Health Energy Cells -->
  <rect x="22" y="42" width="20" height="8" rx="2" fill="#10b981" />
  <rect x="22" y="31" width="20" height="8" rx="2" fill="#06b6d4" />
  <!-- Electric Lightning Diagnostic Bolt -->
  <polygon points="34,18 25,32 32,32 30,46 41,30 34,30" fill="#facc15" filter="url(#glow)" />
</svg>